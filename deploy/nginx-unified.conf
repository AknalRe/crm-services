server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html index.htm;
    client_max_body_size 16m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Server-Sent Events (SSE) - disable proxy buffering and allow long-lived stream
    location = /api/events {
        proxy_pass http://127.0.0.1:5000/api/events;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Fastify API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
    }

    # Health check passthrough
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Crawler & AI discovery files (root & optional app-gateway prefix)
    location ~ ^(/app/[^/]+)?/robots\.txt$ {
        rewrite ^ /api/public/seo/robots.txt last;
    }
    location ~ ^(/app/[^/]+)?/sitemap\.xml$ {
        rewrite ^ /api/public/seo/sitemap.xml last;
    }
    location ~ ^(/app/[^/]+)?/llms\.txt$ {
        rewrite ^ /api/public/seo/llms.txt last;
    }
    location ~ ^(/app/[^/]+)?/llms-full\.txt$ {
        rewrite ^ /api/public/seo/llms-full.txt last;
    }

    # Serve rich UTF-8 link preview metadata to messaging crawlers on public CSAT route
    location ~ ^(/app/[^/]+)?/csat$ {
        if ($http_user_agent ~* "(WhatsApp|facebookexternalhit|Facebot|Twitterbot|TelegramBot|Slackbot|Discordbot)") {
            rewrite ^ /api/public/csat/preview last;
        }
        try_files $uri /index.html;
    }

    # Serve pre-rendered semantic HTML + JSON-LD to AI assistants & search crawlers on landing routes
    location ~ ^(/app/[^/]+)?/(landing/?)?$ {
        if ($http_user_agent ~* "(GPTBot|ChatGPT|OAI-|OpenAI|Claude|Anthropic|Perplexity|Googlebot|Google-Extended|Bingbot|BingPreview|Applebot|DuckDuck|DuckAssist|MistralAI|Meta-External|Amazonbot|Bytespider|Cohere|Slackbot|WhatsApp|facebookexternalhit|Facebot|Twitterbot|TelegramBot|Discordbot|LinkedInBot|HeadlessChrome|curl|Wget|python|httpx|aiohttp|Go-http-client|node|undici|axios)") {
            rewrite ^ /api/public/seo/landing last;
        }
        if ($http_accept ~* "text/markdown") {
            rewrite ^ /api/public/seo/landing last;
        }
        try_files $uri /index.html;
    }

    # Frontend SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}


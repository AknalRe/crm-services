services:
  # Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_password}
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  # Redis for Queue (BullMQ) & Interval Pacing
  redis:
    image: redis:7-alpine
    container_name: crm_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  # WAHA (WhatsApp HTTP API) Core Server
  waha:
    image: devlikeapro/waha:latest
    container_name: crm_waha
    restart: unless-stopped
    ports:
      - "${WAHA_PORT:-3000}:3000"
    environment:
      WHATSAPP_HOOK_URL: http://backend:5000/api/waha/webhook
      WHATSAPP_HOOK_EVENTS: "message,message.ack,session.status,presence.update"
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WAHA_PRINT_QR: "True"
      WAHA_API_KEY: ${WAHA_API_KEY:-}
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - crm_network

  # Backend API & Worker (Express + Prisma + BullMQ)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm_user}:${POSTGRES_PASSWORD:-crm_password}@postgres:5432/${POSTGRES_DB:-crm_db}?schema=public
      REDIS_URL: redis://redis:6379
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WEBHOOK_URL: http://backend:5000/api/waha/webhook
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm_network

  # Frontend Web App (React + Vite + Tailwind + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - crm_network

volumes:
  postgres_data:
  redis_data:
  waha_sessions:

networks:
  crm_network:
    driver: bridge

